name: Verificar construcción WinForms
on:
  pull_request:
    paths: ['Taller/**', '.github/workflows/validar-interfaz.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formularios:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validar sintaxis de herramientas PowerShell sin ejecutarlas
        shell: pwsh
        run: |
          foreach ($archivo in Get-ChildItem scripts/*.ps1) {
            $tokens = $null; $errores = $null
            [System.Management.Automation.Language.Parser]::ParseFile($archivo.FullName, [ref]$tokens, [ref]$errores) | Out-Null
            if ($errores.Count) { throw ($errores | Out-String) }
          }
      - name: Construir solución
        run: dotnet build Taller/Taller.sln --configuration Release --nologo
      - name: Construir vista de las cuatro capas
        run: dotnet build Taller/Taller.Sistema.slnf --configuration Release --no-restore --nologo
      - name: Construir formularios reales en STA sin conectar a SQL
        run: dotnet run --project Taller/Taller.Pruebas.Interfaz --configuration Release --no-build
