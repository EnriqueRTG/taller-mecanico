name: Compilar y probar Taller
on:
  pull_request:
    paths: ['Taller/**', '.github/workflows/validar-taller.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Taller/Taller.sln --configuration Release --nologo
      - run: dotnet test Taller/Taller.Pruebas/Taller.Pruebas.csproj --configuration Release --no-build --nologo

  respaldos-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: SGTM_CI_Aislado_2026!SoloPruebas
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SGTM_CI_Aislado_2026!SoloPruebas' -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Preparar carpeta de copias en el contenedor aislado
        run: docker exec ${{ job.services.sqlserver.id }} mkdir -p /var/opt/mssql/backup
      - name: Probar circuito, migraciones y recuperación solo en bases temporales
        env:
          SGTM_SQL_PRUEBAS: 'Server=localhost,1433;Database=master;User ID=sa;Password=SGTM_CI_Aislado_2026!SoloPruebas;Encrypt=True;TrustServerCertificate=True'
          SGTM_PERMITIR_PRUEBAS_SQL: '1'
          SGTM_SQL_CARPETA_PRUEBAS: /var/opt/mssql/backup
        run: dotnet test Taller/Taller.Pruebas/Taller.Pruebas.csproj --configuration Release --nologo --filter FullyQualifiedName~SqlPruebas -m:1
