</text><text x="260.0" y="211.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Registrar selección parcial</text><text x="260.0" y="235.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Persona, medio y motivo</text><rect x="70" y="330" width="380" height="90" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="260.0" y="369.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">PendienteRevisionTecnica</text><text x="260.0" y="393.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Todavía sin autorización de ejecutar</text><rect x="70" y="500" width="380" height="90" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="260.0" y="539.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Técnico</text><text x="260.0" y="563.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Revisar viabilidad</text><rect x="690" y="200" width="380" height="90" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="880.0" y="239.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Exactamente lo elegido</text><text x="880.0" y="263.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">y mismas condiciones</text><rect x="690" y="370" width="380" height="90" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="880.0" y="397.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Validar selección</text><text x="880.0" y="421.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Mismo presupuesto Aceptado</text><text x="880.0" y="445.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Sin segunda aceptación</text><rect x="690" y="540" width="380" height="90" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="880.0" y="591.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Tomar ejecución autorizada</text><rect x="70" y="750" width="380" height="90" rx="