<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="900" viewBox="0 0 1250 900"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="60" font-family="Arial" font-size="28" text-anchor="start" fill="#172033">SGTM Corrección de adicionales</text><text x="40" y="105" font-family="Arial" font-size="17" text-anchor="start" fill="#172033">Borrador no es una decisión del cliente. Siempre requiere nueva presentación y aceptación.</text><polyline points="295,270 295,340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polyline points="295,450 295,520" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polyline points="520,575 700,575" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polyline points="925,520 925,450" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><polyline points="925,340 925,270" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="160" width="450" height="110" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="295.0" y="195" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Recepción pide corrección</text><text x="295.0" y="220" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Adicional vigente, sin ejecución</text><text x="295.0" y="245" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Sin liquidación ni atención cerrada</text><rect x="70" y="340" width="450" height="110" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="295.0" y="375" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Conservar anterior como histórico</text><text x="295.0" y="400" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Crear Borrador enlazado</text><text x="295.0" y="425" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Sin presentación ni decisión ficticias</text><rect x="70" y="520" width="450" height="110" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="295.0" y="555" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Técnico: Corregir adicional</text><text x="295.0" y="580" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Revisar alcance, solicitudes y motivo</text><text x="295.0" y="605" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Confirmar nueva propuesta</text><rect x="700" y="520" width="450" height="110" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="925.0" y="555" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">PendientePresentacion</text><text x="925.0" y="580" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Nueva versión enlazada</text><text x="925.0" y="605" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Sin autorización para ejecutar</text><rect x="700" y="340" width="450" height="110" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="925.0" y="375" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Recepción comunica y registra decisión</text><text x="925.0" y="400" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Persona, medio e ítems reales</text><text x="925.0" y="425" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">No reutilizar consentimiento anterior</text><rect x="700" y="160" width="450" height="110" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="925.0" y="195" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Aceptado: ejecutar solo lo autorizado</text><text x="925.0" y="220" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Rechazado: no ejecutar adicional</text><text x="925.0" y="245" font-family="Arial" font-size="18" text-anchor="middle" fill="#172033">Acuerdo principal conservado</text><text x="70" y="735" font-family="Arial" font-size="18" text-anchor="start" fill="#172033">La selección parcial real se trata en la vista 5:</text><text x="70" y="765" font-family="Arial" font-size="18" text-anchor="start" fill="#172033">solo esa selección exacta puede validarse sin otra aceptación.</text></svg>